<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해충 클레임 대응 매뉴얼</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --navy: #1E2761;
    --navy-deep: #12173F;
    --navy-soft: #4A5296;
    --paper-tint: #F6F7FB;
    --line: #E3E5F0;
    --ink: #1B1D2A;
    --ink-soft: #5B5F76;
    --gold: #C79A3F;
    --go: #1F7A5C;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    font-family:'Noto Sans KR','맑은 고딕','Malgun Gothic',sans-serif;
    background:var(--paper-tint);
    color:var(--ink);
    line-height:1.6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .page{
    background:var(--navy);
    background-image:linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius:28px;
    width:100%;
    max-width:820px;
    padding:56px 40px 48px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .page::after{
    content:""; position:absolute; right:-70px; top:-70px;
    width:280px; height:280px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.08);
  }
  .page::before{
    content:""; position:absolute; left:-90px; bottom:-90px;
    width:220px; height:220px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.06);
  }

  .inner{position:relative; z-index:1;}

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:700; letter-spacing:0.14em;
    color:var(--gold); text-transform:uppercase; margin-bottom:16px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--gold);}

  h1{
    font-size:clamp(24px, 4vw, 32px);
    font-weight:900; letter-spacing:-0.01em;
    margin-bottom:10px;
  }
  .sub{
    font-size:14.5px; color:rgba(255,255,255,0.68);
    max-width:520px; margin-bottom:40px;
  }

  .cards{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:640px){ .cards{grid-template-columns:1fr 1fr;} }

  .card{
    display:block;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;
    padding:26px 24px;
    text-decoration:none;
    color:#fff;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .card:hover{
    background:rgba(255,255,255,0.11);
    border-color:rgba(255,255,255,0.26);
    transform:translateY(-2px);
  }
  .card:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  .card-icon{
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:900;
    margin-bottom:16px;
  }
  .card.mate .card-icon{background:rgba(140,231,190,0.16); color:#8CE7BE;}
  .card.manager .card-icon{background:rgba(199,154,63,0.18); color:var(--gold);}

  .card-title{font-size:18px; font-weight:900; margin-bottom:6px;}
  .card-desc{font-size:13px; color:rgba(255,255,255,0.62); line-height:1.6; margin-bottom:18px;}

  .card-cta{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; letter-spacing:0.02em;
  }
  .card.mate .card-cta{color:#8CE7BE;}
  .card.manager .card-cta{color:var(--gold);}
  .card-cta .arrow{transition:transform 0.15s ease;}
  .card:hover .card-cta .arrow{transform:translateX(3px);}

  .foot{
    margin-top:36px;
    font-size:11.5px;
    color:rgba(255,255,255,0.4);
    text-align:center;
  }
</style>
</head>
<body>

  <div class="page">
    <div class="inner">
      <div class="eyebrow"><span class="dot"></span>CX 현장 매뉴얼</div>
      <h1>해충 클레임 대응 매뉴얼</h1>
      <p class="sub">역할에 맞는 매뉴얼을 선택해 주세요. 메이트는 초동 대응 4단계를, 관리자는 이관 이후 종결까지의 행동강령을 다룹니다.</p>

      <div class="cards">
        <a class="card mate" href="pest_claim_manual.html">
          <div class="card-icon">M</div>
          <div class="card-title">메이트용</div>
          <div class="card-desc">해충 발견 시 초동 대응 — 사과, 은폐 수거, 관리자 보고까지 현장에서 바로 해야 할 행동</div>
          <div class="card-cta">매뉴얼 보기 <span class="arrow">→</span></div>
        </a>

        <a class="card manager" href="manager_claim_manual.html">
          <div class="card-icon">관</div>
          <div class="card-title">관리자용</div>
          <div class="card-desc">보고 접수 후 현장 이동, 보상 안내, 재발 방지 약속과 본사 보고까지의 종결 절차</div>
          <div class="card-cta">매뉴얼 보기 <span class="arrow">→</span></div>
        </a>
      </div>

      <p class="foot">CX팀 · 해충 클레임 대응 매뉴얼</p>
    </div>
  </div>

</body>
</html>
